<!doctype html>
<html lang="ko" data-theme="yahang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c10">
<meta name="robots" content="noindex">
<title>야행국 · 점검 중</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 점검 페이지 전용. 색·모서리·글꼴은 모두 테마 토큰을 쓰므로 저장된 테마가 그대로 입혀진다. 평면 디자인(그라데이션·그림자·흐림 없음). */
  .mt { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .mt-box { width: 100%; max-width: 480px; display: grid; gap: 18px; }
  .mt-brand { display: flex; align-items: center; gap: 10px; color: var(--text); }
  .mt-brand b { font-family: var(--font-serif); font-size: 18px; letter-spacing: .08em; }
  .mt-brand .seal { width: 36px; height: 36px; font-size: 20px; border-radius: 10px; }
  .mt-card { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
  .mt-scene { display: block; width: 100%; height: auto; background: var(--surface-2); border-bottom: var(--bw) solid var(--line); color: var(--line); }
  .mt-scene .moon { fill: var(--gold); }
  .mt-scene .roof { fill: var(--bg); }
  .mt-scene .lamp { fill: var(--accent); }
  .mt-scene .lamp-on { animation: mt-flicker 3.2s ease-in-out infinite; }
  .mt-scene .lamp-on:nth-of-type(2n) { animation-delay: -1.4s; }
  @keyframes mt-flicker { 0%, 100% { opacity: 1; } 45% { opacity: .55; } 55% { opacity: .9; } }
  .mt-body { padding: 20px; display: grid; gap: 14px; }
  .mt-state { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--warn); border: var(--bw) solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .mt-state i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .mt-state i::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: currentColor; animation: pulse 1.8s ease-out infinite; }
  .mt-state.offline { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .mt-state.open { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .mt h1 { font-family: var(--font-serif); font-size: 26px; font-weight: 700; }
  .mt-msg { color: var(--muted); }
  .mt-info { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; padding: 14px; border-radius: var(--r); background: var(--surface-2); font-size: 14px; }
  .mt-info dt { color: var(--muted); } .mt-info dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  .mt-notes[hidden] { display: none; }
  .mt-notes h2 { font-size: 14px; margin-bottom: 6px; }
  .mt-notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
  .mt-actions { display: grid; gap: 8px; }
  .mt-foot { text-align: center; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .mt-scene .lamp-on, .mt-state i::after { animation: none; } }
</style>
</head>
<body>
<!-- 동작 표식: data-maint-message(안내 문구)·data-maint-checked(마지막 확인)·data-maint-retry(다시 확인) 등. assets/js/maintenance.js가 채운다. -->
<main class="mt">
  <div class="mt-box">
    <div class="mt-brand"><span class="seal">夜</span><b>夜行局 야행국</b></div>
    <section class="mt-card" aria-labelledby="mt-title">
      <svg class="mt-scene" viewBox="0 0 480 150" role="img" aria-label="등불이 걸린 밤 지붕">
        <circle class="moon" cx="388" cy="46" r="22"/>
        <circle cx="398" cy="40" r="20" fill="var(--surface-2)"/>
        <path d="M0 150 V108 H34 L60 92 L86 108 H118 V150 Z" class="roof"/>
        <path d="M104 150 V96 H128 L172 70 L216 96 H240 V150 Z" class="roof"/>
        <path d="M226 150 V112 H252 L280 98 L308 112 H330 V150 Z" class="roof"/>
        <path d="M316 150 V102 H336 L372 82 L408 102 H428 V150 Z" class="roof"/>
        <path d="M414 150 V116 H440 L460 106 L480 116 V150 Z" class="roof"/>
        <path d="M24 60 Q132 92 240 66 T456 70" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <g>
          <rect class="lamp lamp-on" x="66" y="73" width="10" height="14" rx="4"/>
          <rect class="lamp lamp-on" x="128" y="78" width="10" height="14" rx="4"/>
          <rect class="lamp lamp-on" x="190" y="72" width="10" height="14" rx="4"/>
          <rect class="lamp lamp-on" x="292" y="70" width="10" height="14" rx="4"/>
          <rect class="lamp lamp-on" x="354" y="72" width="10" height="14" rx="4"/>
          <rect class="lamp lamp-on" x="416" y="70" width="10" height="14" rx="4"/>
        </g>
      </svg>
      <div class="mt-body">
        <span class="mt-state" data-maint-state><i aria-hidden="true"></i><span data-maint-state-text>점검 중</span></span>
        <h1 id="mt-title" data-maint-title>서버 점검 중입니다</h1>
        <p class="mt-msg" data-maint-message>더 나은 밤길을 위해 잠시 문을 닫았습니다. 점검이 끝나면 이 화면이 저절로 게임으로 돌아갑니다.</p>
        <dl class="mt-info">
          <dt>예상 종료</dt><dd data-maint-until>끝나는 대로 열립니다</dd>
          <dt>마지막 확인</dt><dd data-maint-checked>-</dd>
          <dt>다음 확인</dt><dd data-maint-next>-</dd>
        </dl>
        <div class="mt-notes" data-maint-notes hidden><h2>이번 점검에서 하는 일</h2><ul></ul></div>
        <div class="mt-actions">
          <button class="btn primary block" data-maint-retry>지금 다시 확인</button>
        </div>
      </div>
    </section>
    <p class="mt-foot">점검 중에도 캐릭터와 소지품은 그대로 보존됩니다.</p>
  </div>
</main>
<script type="module" src="assets/js/maintenance.js"></script>
</body>
</html>
