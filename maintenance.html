<!doctype html>
<html lang="ko" data-theme="yahang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c10">
<meta name="robots" content="noindex">
<title>야행국 · 점검 중</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<!-- 임시 점검 페이지: 다른 점검 페이지로 바꿀 때도 아래 data-maint-* 표식과 maintenance.js 스크립트를 남겨 두면 테마 적용·자동 복귀가 그대로 동작한다. -->
<main class="center-screen">
  <div class="card narrow maint-card">
    <div class="seal seal-lg">夜</div>
    <h1>서버 점검 중입니다</h1>
    <p class="muted" data-maint-message>더 나은 밤길을 위해 잠시 문을 닫았습니다. 점검이 끝나면 이 화면이 저절로 게임으로 돌아갑니다.</p>
    <p class="muted small">마지막 확인 <b data-maint-checked>-</b> · 30초마다 다시 확인합니다.</p>
    <button class="btn primary block" data-maint-retry>지금 다시 확인</button>
  </div>
</main>
<script type="module" src="assets/js/maintenance.js"></script>
</body>
</html>
