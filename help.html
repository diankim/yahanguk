<!doctype html>
<html lang="ko" data-theme="yahang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c10">
<meta name="robots" content="noindex">
<title>야행국 · 도움말</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 점검 대기 중에 여는 도움말(7.5.8): 게임 화면 없이 도움말 본문만. 게임 서버(DB)는 부르지 않는다. */
  .hp { max-width: 980px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .hp-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--text); }
  .hp-brand b { font-family: var(--font-serif); font-size: 17px; letter-spacing: .08em; }
  .hp-brand .seal { width: 32px; height: 32px; font-size: 18px; border-radius: 9px; }
  .hp-note { margin: 0 0 12px; color: var(--muted); font-size: calc(13px * var(--fz, 1)); }
</style>
</head>
<body>
<main class="hp">
  <div class="hp-brand"><span class="seal">夜</span><b>夜行局 야행국</b></div>
  <p class="hp-note">점검 동안 게임에는 들어갈 수 없지만, 도움말은 여기서 읽을 수 있습니다. 서버가 열리면 대기 화면이 저절로 게임으로 돌아갑니다.</p>
  <div id="help-root"><p class="muted">도움말을 불러오는 중…</p></div>
</main>
<script type="module">
  import { applySavedTheme } from './assets/js/theme.js';
  applySavedTheme();
  try {
    const { render } = await import('./assets/js/views/guide.js');
    render(document.getElementById('help-root'), { standalone: true });
  } catch (e) {
    document.getElementById('help-root').innerHTML = '<p class="muted">도움말을 불러오지 못했습니다. <a href="maintenance.html">대기 화면으로</a></p>';
    console.error(e);
  }
</script>
</body>
</html>
